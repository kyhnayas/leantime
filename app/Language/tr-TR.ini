text.mattermost_instructions="Bu entegrasyon, seçtiğiniz kanala güncelleme bildirimleri gönderir.<br/>Mattermost'tan bir Gelen Webhook URL'si almak için <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>buradaki talimatları izleyin</a>. Ardından bağlantıyı sağdaki forma yapıştırın ve Kaydet'e tıklayın."
