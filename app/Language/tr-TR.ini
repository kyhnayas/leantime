text.lean.helper_content="Yalın tuval, yeni iş ve/veya ürün fikrinizin tam fikir doğrulama sürecinde size rehberlik edecektir.<br/><em>Müşteri Segmentinizi</em>, <em>Probleminizi, Çözümünüzü</em> ele alacaksınız.<br/>Oradan, <em>Benzersiz Değer Teklifinize</em> (fikrinizi diğer tekliflerden daha iyi yapan nedir?), <em>Dağıtım Kanallarınıza</em> (çözümünüzü müşterilerinize nasıl ulaştıracaksınız?), <em>Gelir Akışlarınıza</em> (çözümünüz nasıl para kazanacak?), <em>Maliyet Yapınıza</em> (çözümünüzün değeri ne kadar?), <em>Anahtar Metriklere</em> (başarıyı nasıl ölçeceksiniz?) ve <em>Haksız Avantajınıza</em> (rekabete karşı başarılı olmanıza yardımcı olacak neyiniz var?) geçeceksiniz.<br/>Bu soruları yanıtlamak, başarıyı teşvik etmek, başarısızlığı azaltmak ve varsayımlarınızı izleyip doğrulamanıza olanak tanımak için tasarlanmıştır. Yalın olmak, israfı ortadan kaldırmak ve müşterilerinizin ihtiyaç duyduğu ürünleri, işleri ve çözümleri oluşturmak için çalışmakla ilgilidir."
