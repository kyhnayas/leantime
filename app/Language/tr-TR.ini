text.advanced_boards_helper_content="Fikirler gelişir, büyür ve olgunlaşır. Burası onları takip etme yeridir.<br/>Fikir kartlarını mevcut durumlarını yansıtacak şekilde bir sütundan diğerine taşıyın.<br/>Burası, uygulamaya başlamadan önce araştırmaya başlamak, prototipler geliştirmek ve bu prototipleri birkaç müşteriyle doğrulamak için iyi bir yerdir."
text.backlog_helper_content="Bir iş listesi, tüm yapılacak işlerinizin evidir; hem şu anda üzerinde çalıştıklarınız hem de üzerinde çalışmayı planladıklarınız.<br/><br/>İş listenizi tamamlama yolunda ilerleme kaydetmek için kısa yinelemelerle - Listeler (Sprint'ler) - çalışmanızı öneririz.<br/>Listeler, daha küçük, teslim edilebilir iş parçalarına odaklanmanıza olanak tanıyan iki haftalık zaman aralıklarıdır.<br/>İki haftanın sonunda 'demo' yapacak bir şeyiniz olmalı. Kullanıcılarınıza veya müşterilerinize değer sağlayan bir şey.<br/><br/>Bu ekranda, yapılacak işlerinizi düzenleyip yönetebilecek, sürükle bırak yöntemiyle iş listenizi önceliklendirebilecek ve İş Listesi öğelerini mevcut Listenize taşıyabileceksiniz.<br/>Daha fazla bilgi ister misiniz? Başlamak için turu başlatın veya kapatın!"
text.glad_youre_here="Burada olmanıza sevindik. Tanışmak için bir dakikanızı ayıralım."
text.business_research_section="İş Araştırması bölümümüz, fikirleriniz için yeni eviniz. Bu bölüm, sizi müşteri geliştirme, problem araştırması ve çözüm düşüncesi adımlarında yönlendirmek için tasarlanmıştır."
text.our_roadmap_design="Yol haritamız, sizi daha küçük yönetilebilir kilometre taşlarından büyük resmi tamamlamaya götürmek için tasarlanmıştır. Yaklaşık 3 ay boyunca kilometre taşları planlayın ve hedefte kalmak için bu proje belirteçlerini kullanın."
text.this_is_where_you_spend_most_time="Zamanınızın çoğunu geçireceğiniz yer burasıdır - yaparak. 2 haftalık Listelerinizi planlayın ve Kanban Panosu ve İş Listesi araçlarımızla başarılı bir şekilde yürütün. Bir sonraki Liste için büyümek için Retrospektifleri kullanın."
text.idea_board_helper_content="Tüm fikirlerinizi toplayabileceğiniz yer burası. Yenilerini ekibinizle tartışın ve fikirlerinize yönelik ilerlemeyi görmek için Kilometre Taşları ekleyin."
text.kanban_helper_content="Kanban, Japonca'da 'kart' anlamına gelir. Kanban panoları, 40'lı yıllarda Toyota mühendisleri tarafından Yalın üretim ile başlatıldı.<br/>Bilgiyi ve iş ilerlemesini hızlı bir şekilde görsel olarak paylaşmak için kullanılır.<br/>Kanban panoları, işi ve durumu görselleştirmek, aktif veya devam eden işleri yönetmeye yardımcı olmak, iş akışını yönetmek ve yalın iyileştirmelere yönelik hızlı hareket etmek için kullanışlıdır."
text.my_timesheets_helper_content="Zaman çizelgeleri, yapılacak işlerde çalışılan fiili saatleri takip edebileceğiniz yerdir.<br/>Bu, faturalandırma amacıyla olduğu kadar, görevlerinizi önceden ne kadar iyi planladığınızı doğrulamak için de yararlıdır.<br/>Fazla mesai, planlama tutarsızlıklarını hesaba katmak için bitiş tarihlerini ayarlayabilir."
text.new_project_helper_content="<p>Burası, projeniz için tanımlayacağınız, atayacağınız ve parametreleri belirleyeceğiniz yerdir. Bu, proje önceliklerini, beklentileri ve yönergeleri<br/>tüm ekibe ileten parça olduğu için önemlidir.</p><p><br/><em>Burada düşünülmesi gerekenler: 4A.<br/>Açık, Anlaşılır, Az ve öz, ve Amaçlı olun.<br/><br/></em> </p><p>Proje açıklamalarınızda bunlara hakim olmak, herkesi aynı sayfada tutar ve hata veya yanlış adım risklerini en aza indirmeye yardımcı olur.</p><br/>Başlama zamanı!<br/><br/>"
text.not_found_helper_content="<p>Bu sayfa için henüz bir içeriğimiz yok.<br/>Burada yapabileceğiniz şeyler hakkında daha fazla bilgi edinmek için lütfen alttaki 'Yardım Gerekiyor' bağlantısını kullanın.</p>"
text.retros_helper_content="<p>Retrospektifler, iş, ekip işleyişi ve tabii ki ilerleme hakkında hızlı yansımalardır.<br/>Burası, ekibinizin nelerin iyi gittiğini, nelerin iyi gitmediğini ve bir dahaki sefere nelerin farklı yapılması gerektiğini anlamak için biraz zaman ayırabileceği yerdir.<br/>Düzenli aralıklarla veya en azından her Kilometre Taşının sonunda bir inceleme toplantısı düzenlemenizi öneririz.<br/></p>"
text.roadmap_helper_content="<p>Yol haritaları, büyük projeleri daha küçük ve daha yönetilebilir parçalara ayırmak için kullanışlıdır.<br/><br/></p><p>Yol haritanızı oluşturmak için, 3 aylık bir zaman aralığında elde edilebilecek Kilometre taşları belirlemenizi öneririz.</p><p>Kilometre taşları, projenin tamamlanmasına giden yolda kontrol noktalarıdır.<br/>Basitçe söylemek gerekirse: Bir arazi yolculuğuna çıkıyorsanız, geçtiğiniz her eyalet bir kilometre taşı olabilir.<br/><br/>Başlamak için sol üst taraftaki 'Kilometre Taşı Ekle'yi tıklayın. Takvimdeki Kilometre taşını tıklayıp sürükleyerek tarihi bu sekmede veya yol haritası çizelgesinde ayarlayın.</p>"
text.show_clients_helper_content="<p>Müşteriler/Ürünler, Projelerinizi kategoriler halinde düzenler ve farklı grupları ayırmanıza olanak tanır.<br/><br/></p><p>Bir danışman olarak, zaten müşterilerle çalışıyorsunuz ve burası onları organize etmek için yeriniz olacaktır.</p><p>Bir Ürün Ekibiyseniz, departmanlarınızı (pazarlama, satış, operasyonlar vb.) organize etmek ve izole etmek için bu bölümü kullanabilirsiniz.</p>"
text.show_projects_helper_content="<p>Projeler, işinizin ve Leantime'ın kalbidir! Değişim, gelişim, hedefler ve inşa edebileceğiniz veya hayal edebileceğiniz her şey projeleri içerecektir.<br/>Proje yönetimi, basitçe projelerinizin zamanında, doğru ve gerçek iş değeriyle teslim edilmesini sağlama sürecidir.<br/><br/>Projelerinizin yaşayacağı yer burasıdır. Projeler sayfanız bir proje oluşturmanıza, yapılacak iş numaralarını, saatleri, bütçe tutarlarını ve projeyle ilişkili müşteriyi hızlıca görmenizi sağlar.<br/><br/>Tüm projelerinize hızlı bir genel bakış için bu sayfayı kullanın.<br/><br/></p>"
text.new_db_version="Yeni bir sürüm yüklendi. Leantime'ı kullanmak için veritabanınızı güncellemeniz gerekecek.<br/><br/><strong>Bu güncellemeyi gerçekleştirmeden önce lütfen veritabanınızı yedeklediğinizden emin olun!</strong><br/> Bu işlem birkaç dakika sürebilir."
text.update_was_successful="Güncelleme başarılı oldu, şimdi giriş yapabilirsiniz. <a href='%1$s'>Girişe Git</a>"
text.this_script_will_set_up_leantime="Bu komut dosyası, veritabanınızı kuracak ve bir yönetici hesabı oluşturacaktır."
